[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effective_barnacle"
version = "0.1.0"
description = "GSR-malliin perustuva realistinen korttien sekoitusalgoritmi"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]